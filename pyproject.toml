[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hj-code-agent"
version = "2.0.0"
description = "HJ CODE AGENT V2 - Agente autonomo de programacion controlado por Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HacheJotaDev" }]
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=42",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2",
]

[project.scripts]
hj-code-agent = "bot.main:main"

[tool.setuptools]
packages = { find = { include = ["bot*", "core*", "security*", "database*", "backend*"] } }

[tool.setuptools.package-data]
database = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
